name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Tests only. GitHub Pages publishes the committed root of main ("Deploy from a branch"),
# so the site goes live without this workflow; it checks that the root is fresh.
# One run per branch; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Static checks (root up to date with src/, syntax, SRI, anchors, step numbering, SEO)
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (desktop and mobile)
        run: npm test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
